[project]
name = "insurance-risk-ml"
version = "0.1.0"
requires-python = "~=3.12.0"

dependencies = [
    "fastapi",
    "pydantic",
    "numpy",
    "scipy",
    "joblib",
    "xgboost-cpu==3.4.1",
    "pymongo",
    "pyjwt",
    "pwdlib[argon2]",
    "email-validator"
]

[tool.vercel]
entrypoint = "src.api.app:app"